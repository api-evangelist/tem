aid: tem
name: Tem
description: >-
  Tem (Tem-Energy Limited) is a UK-based energy technology company building
  AI-native transaction infrastructure for a modern energy market. Its RED
  platform is a modern utility that removes wholesale market markups to cut
  business electricity costs by up to 30%, provides transparent line-by-line
  billing from half-hourly meter data, and gives generators fairer earnings
  with renewable-energy traceability across 6,000+ sites. Backed by a February
  2026 GBP 55M Series B led by Lightspeed Venture Partners. The customer-facing
  platform runs at app.tem.energy behind an OIDC login; the platform API at
  api.tem.energy is a private AWS API Gateway with no publicly documented
  developer surface at the time of profiling.
